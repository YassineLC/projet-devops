name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalogue-service, emprunts-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests Gradle
        run: chmod +x gradlew && ./gradlew test --no-daemon

  front:
    name: Build front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run build

  manifests:
    name: Validation des manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rendu Kustomize
        run: kubectl kustomize k8s/overlays/minikube > rendu.yaml
      - name: Validation kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas rendu.yaml

  images:
    name: Image ${{ matrix.image }}
    needs: [tests, front, manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: biblio-catalogue
            dockerfile: catalogue-service/Dockerfile
            context: .
          - image: biblio-emprunts
            dockerfile: emprunts-service/Dockerfile
            context: .
          - image: biblio-front
            dockerfile: front/Dockerfile
            context: front
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag de version
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan Trivy (bloquant sur CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Rapport Trivy (SARIF)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - name: Envoi du rapport dans l'onglet Security
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: ${{ matrix.image }}
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push Docker Hub
        run: docker push "$IMAGE:$TAG"

  deploiement:
    name: Mise à jour GitOps (ArgoCD)
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Nouveau tag dans l'overlay minikube
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          for img in biblio-catalogue biblio-emprunts biblio-front; do
            yq -i "(.images[] | select(.name == \"yassinelahmar/$img\")).newTag = \"$TAG\"" k8s/overlays/minikube/kustomization.yaml
          done
          git diff --stat
      - name: Commit (ArgoCD synchronise ensuite le cluster)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Déploiement de la version sha-${GITHUB_SHA::7} [skip ci]"
          git push
