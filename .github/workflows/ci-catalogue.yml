name: CI - catalogue-service

on:
  push:
    branches: [main]
    paths:
      - 'catalogue-service/**'
      - 'proto/**'
      - '.github/workflows/ci-catalogue.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: catalogue-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: yassinelahmar   # nom public du compte, pas un secret (absent des runs Dependabot)
  SERVICE: catalogue-service
  IMAGE: biblio-catalogue
  DOCKERFILE: catalogue-service/Dockerfile
  CONTEXT: .

jobs:
  test:
    name: Catalogue tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin

      # Cache Gradle géré par l'action officielle (sauvegarde fiable par job)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run tests
        working-directory: catalogue-service
        run: chmod +x gradlew && ./gradlew clean test --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-test-reports
          path: |
            catalogue-service/build/test-results/test/
            catalogue-service/build/reports/tests/test/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Catalogue quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '21'
          distribution: temurin

      # Cache Gradle géré par l'action officielle (sauvegarde fiable par job)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run Checkstyle
        working-directory: catalogue-service
        run: chmod +x gradlew && ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-quality-reports
          path: catalogue-service/build/reports/checkstyle/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Catalogue Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, quality]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (amd64 + arm64) and optionally push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=catalogue
          cache-to: type=gha,scope=catalogue,mode=max

  supply-chain:
    name: Catalogue supply chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: docker
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    env:
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Image references by digest
        run: |
          {
            echo "GHCR_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}"
            echo "GHCR_REF=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}@${DIGEST}"
            echo "HUB_REF=docker.io/${DOCKERHUB_NAMESPACE}/${IMAGE}@${DIGEST}"
          } >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image by digest (keyless)
        run: |
          cosign sign --yes "$GHCR_REF"
          cosign sign --yes "$HUB_REF"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_REF }}
          format: spdx-json
          output-file: catalogue-sbom.spdx.json
          artifact-name: catalogue-sbom.spdx.json
          upload-artifact-retention: 7

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: catalogue-sbom.spdx.json
          push-to-registry: true

      - name: Verify signatures and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci-catalogue.yml@refs/heads/main
        run: |
          for ref in "$GHCR_REF" "$HUB_REF"; do
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" > /dev/null
            echo "Signature OK : $ref"
          done
          gh attestation verify "oci://$GHCR_REF" --repo "$GITHUB_REPOSITORY"

      - name: Scan published digest with Trivy (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REF }}
          format: sarif
          output: trivy-catalogue.sarif

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-catalogue.sarif') != ''
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-catalogue.sarif
          category: trivy-catalogue

  gitops:
    name: Catalogue GitOps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker, supply-chain]
    permissions:
      contents: read
    steps:
      # main est protégée : seule la deploy key GitOps peut y pousser directement
      - name: Checkout code (deploy key GitOps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}

      - name: Pin the signed digest in the minikube overlay
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            yq -i "(.images[] | select(.name == \"yassinelahmar/${IMAGE}\")) |= (.newTag = \"sha-${GITHUB_SHA::7}\" | .digest = \"${DIGEST}\")" \
              k8s/overlays/minikube/kustomization.yaml
            git commit -qam "Déploiement de ${IMAGE} sha-${GITHUB_SHA::7} [skip ci]" || exit 0
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --hard origin/main
          done
          exit 1
