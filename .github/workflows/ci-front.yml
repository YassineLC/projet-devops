name: CI - front

on:
  push:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/ci-front.yml'
  pull_request:
    branches: [main]
    paths:
      - 'front/**'
      - '.github/workflows/ci-front.yml'
  workflow_dispatch:

concurrency:
  group: front-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICE: front
  IMAGE: biblio-front
  DOCKERFILE: front/Dockerfile
  CONTEXT: front

jobs:
  test:
    name: Front build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-dist
          path: front/dist/
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Front quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint
  docker:
    name: Docker image (buildx multi-arch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [test, quality]
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GHCR image name (lowercase)
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (amd64 + arm64) and optionally push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max

  supply-chain:
    name: Supply chain
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: docker
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    env:
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Image references by digest
        run: |
          {
            echo "GHCR_NAME=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}"
            echo "GHCR_REF=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE}@${DIGEST}"
            echo "HUB_REF=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${IMAGE}@${DIGEST}"
          } >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign image by digest (keyless)
        run: |
          cosign sign --yes "$GHCR_REF"
          cosign sign --yes "$HUB_REF"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.GHCR_REF }}
          format: spdx-json
          output-file: front-sbom.spdx.json
          artifact-name: front-sbom.spdx.json
          upload-artifact-retention: 7

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_NAME }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: front-sbom.spdx.json
          push-to-registry: true

      - name: Verify signatures and attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/ci-front.yml@refs/heads/main
        run: |
          for ref in "$GHCR_REF" "$HUB_REF"; do
            cosign verify \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$ref" > /dev/null
            echo "Signature OK : $ref"
          done
          gh attestation verify "oci://$GHCR_REF" --repo "$GITHUB_REPOSITORY"

      - name: Scan published digest with Trivy (blocking on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.GHCR_REF }}
          format: sarif
          output: trivy-front.sarif

      - name: Upload Trivy results
        if: always() && hashFiles('trivy-front.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-front.sarif
          category: trivy-front

  gitops:
    name: GitOps (ArgoCD)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [docker, supply-chain]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pin the signed digest in the minikube overlay
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3 4 5; do
            git pull --rebase --quiet origin main
            yq -i "(.images[] | select(.name == \"yassinelahmar/${IMAGE}\")) |= (.newTag = \"sha-${GITHUB_SHA::7}\" | .digest = \"${DIGEST}\")" \
              k8s/overlays/minikube/kustomization.yaml
            git commit -qam "Déploiement de ${IMAGE} sha-${GITHUB_SHA::7} [skip ci]" || exit 0
            git push --quiet origin HEAD:main && exit 0
            git reset --quiet --hard origin/main
          done
          exit 1
