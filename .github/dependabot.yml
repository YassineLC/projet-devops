# Mises à jour regroupées : une PR par écosystème et par mois (les alertes de
# sécurité restent traitées immédiatement par les correctifs de sécurité GitHub).
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directories: [/catalogue-service, /emprunts-service]
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Plugin protobuf 0.10.x incompatible avec l'intégration gRPC de Spring Boot
      # (protoc introuvable) ; Spring Initializr reste en 0.9.6 avec Boot 4.2
      - dependency-name: com.google.protobuf
        versions: [">= 0.10.0"]
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      front:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/catalogue-service, /emprunts-service, /front]
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 1
    groups:
      images-de-base:
        patterns: ["*"]
    ignore:
      # Les versions majeures de Java et Node définissent la base du projet
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
