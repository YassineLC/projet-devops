version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directories: [/catalogue-service, /emprunts-service]
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      spring-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /front
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      front-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/catalogue-service, /emprunts-service, /front]
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    ignore:
      # Les versions majeures de Java et Node définissent la base du projet
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
