# Déploiement continu GitOps : ArgoCD applique automatiquement k8s/overlays/minikube
# à chaque commit sur main (dont ceux de la CI qui changent les tags d'images).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bibliotheque
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YassineLC/projet-devops.git
    targetRevision: main
    path: k8s/overlays/minikube
  destination:
    server: https://kubernetes.default.svc
    namespace: bibliotheque
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
