# Secrets chiffrés avec kubeseal : seul le contrôleur Sealed Secrets du cluster peut les déchiffrer.
# Régénération : voir securite/README.md
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: bibliotheque
spec:
  encryptedData:
    CATALOGUE_DB_PASSWORD: 
    EMPRUNTS_DB_PASSWORD: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-credentials
      namespace: bibliotheque
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: catalogue-db
  namespace: bibliotheque
spec:
  encryptedData:
    SPRING_DATASOURCE_PASSWORD: 
    SPRING_DATASOURCE_URL: 
    SPRING_DATASOURCE_USERNAME: 
  template:
    metadata:
      name: catalogue-db
      namespace: bibliotheque
---
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: emprunts-db
  namespace: bibliotheque
spec:
  encryptedData:
    SPRING_DATASOURCE_PASSWORD: 
    SPRING_DATASOURCE_URL: 
    SPRING_DATASOURCE_USERNAME: 
  template:
    metadata:
      name: emprunts-db
      namespace: bibliotheque
