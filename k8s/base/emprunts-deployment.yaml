apiVersion: v1
kind: ServiceAccount
metadata:
  name: emprunts
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emprunts
  labels:
    app: emprunts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emprunts
  template:
    metadata:
      labels:
        app: emprunts
        version: v1
    spec:
      serviceAccountName: emprunts
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Attend que Postgres accepte les connexions avant de démarrer Spring Boot
        - name: attente-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432 -U admin; do sleep 2; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: emprunts
          image: yassinelahmar/biblio-emprunts:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: emprunts-db
          env:
            # Appel gRPC vers le catalogue (nom DNS du Service Kubernetes)
            - name: CATALOGUE_GRPC_TARGET
              value: "static://catalogue-service:9090"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: emprunts-service
  labels:
    app: emprunts
spec:
  type: ClusterIP
  selector:
    app: emprunts
  ports:
    - name: http
      port: 8080
      targetPort: http
