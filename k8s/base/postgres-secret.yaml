  labels:
    app: catalogue
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/catalogue"
  SPRING_DATASOURCE_USERNAME: "catalogue"
  SPRING_DATASOURCE_PASSWORD: "catalogue-biblio-2026"
---
apiVersion: v1
kind: Secret
metadata:
  name: emprunts-db
  labels:
    app: emprunts
type: Opaque
stringData:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/emprunts"
  SPRING_DATASOURCE_USERNAME: "emprunts"
  SPRING_DATASOURCE_PASSWORD: "emprunts-biblio-2026"
