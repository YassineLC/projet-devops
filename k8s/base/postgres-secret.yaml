# Identifiants de démo (projet local). stringData : encodé en base64 par Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "admin-biblio-2026"
  CATALOGUE_DB_PASSWORD: "catalogue-biblio-2026"
  EMPRUNTS_DB_PASSWORD: "emprunts-biblio-2026"
