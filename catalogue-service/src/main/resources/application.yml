spring:
  application:
    name: catalogue-service
  datasource:
    url: jdbc:h2:mem:catalogue
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  grpc:
    server:
      port: 9090

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
